<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sombra Heat — Puerto Sombra</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a16; }
  #game { position: fixed; inset: 0; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sombra Heat: an open-world crime game in the coastal city of Puerto Sombra. Drive and walk with W A S D, enter cars with E, fight with F, shoot with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
